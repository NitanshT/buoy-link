[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "buoy-link"
version = "0.1.0"
description = "Read-only diagnostics for the HKUST robotic-fish communications buoy"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
buoy-diagnostics = "buoy_link.diagnostics:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
